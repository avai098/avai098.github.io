name: Deploy Hugo site to Pages

on:
  # 每当 main 分支有代码推送时，自动触发运行
  push:
    branches:
      - main
  # 允许在 GitHub 网页上手动点击按钮触发
  workflow_dispatch:

# 设置云端机器人的权限：允许它读取代码，并写入 Pages 部署区
permissions:
  contents: read
  pages: write
  id-token: write

# 避免并发冲突：同一时间只运行一个最新的部署任务
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 任务 1：在云端编译网站
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码及主题子模块
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 极其重要：把 PaperMod 主题 submodule 一并拉取下来
          fetch-depth: 0

      - name: 安装 Hugo (Extended 扩展版)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true         # 开启扩展版，以便正确编译 PaperMod 的样式

      - name: 使用 Hugo 编译出静态网页
        run: hugo --minify

      - name: 上传网页产物到部署区
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # 任务 2：将编译好的产物发布到 GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 正式发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4